services:
  backend:
    build: .
    env_file:
      - .env
    environment:
      PORT: "5443"
      SSL_KEY_PATH: /run/hustlehub-tls/key.pem
      SSL_CERT_PATH: /run/hustlehub-tls/cert.pem
    volumes:
      - ./certs:/run/hustlehub-tls:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const ca = require('node:fs').readFileSync(process.env.SSL_CERT_PATH);
          require('node:https').get('https://localhost:5443/api/gigs', { ca }, res => {
            res.resume();
            if (res.statusCode !== 200) process.exitCode = 1;
          }).on('error', () => { process.exitCode = 1; });
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  frontend:
    build: ./client
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./certs:/run/hustlehub-tls:ro
