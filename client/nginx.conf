server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate /run/hustlehub-tls/cert.pem;
    ssl_certificate_key /run/hustlehub-tls/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass https://backend:5443;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_trusted_certificate /run/hustlehub-tls/cert.pem;
        proxy_ssl_verify on;
    }

    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        try_files $uri $uri/ /index.html;
    }
}
